apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels: {app: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: institution-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8100}]
          command: ["uvicorn"]
          args: ["institution_server.main:app", "--host", "0.0.0.0", "--port", "8100"]
          env:
            - {name: PREDIXALEARN_INSTITUTION_ENV, value: production}
            - {name: PREDIXALEARN_PUBLIC_BASE_URL, value: {{ .Values.config.publicBaseUrl | quote }}}
            - {name: PREDIXALEARN_AUTH_MODE, value: oidc}
            - {name: PREDIXALEARN_OIDC_ISSUER, value: {{ .Values.config.oidcIssuer | quote }}}
            - {name: PREDIXALEARN_OIDC_AUDIENCE, value: {{ .Values.config.oidcAudience | quote }}}
            - {name: PREDIXALEARN_OIDC_JWKS_URL, value: {{ .Values.config.oidcJwksUrl | quote }}}
            - {name: PREDIXALEARN_OIDC_AUTHORIZATION_ENDPOINT, value: {{ .Values.config.oidcAuthorizationEndpoint | quote }}}
            - {name: PREDIXALEARN_OIDC_TOKEN_ENDPOINT, value: {{ .Values.config.oidcTokenEndpoint | quote }}}
            - {name: PREDIXALEARN_STORAGE_PROVIDER, value: {{ .Values.config.storageProvider | quote }}}
            - {name: PREDIXALEARN_S3_BUCKET, value: {{ .Values.config.s3Bucket | quote }}}
            - {name: PREDIXALEARN_SEMANTIC_SEARCH, value: {{ .Values.config.semanticSearch | quote }}}
            - {name: PREDIXALEARN_EXTERNAL_AI, value: {{ .Values.config.externalAi | quote }}}
            - {name: PREDIXALEARN_FEATURES, value: {{ .Values.config.features | quote }}}
          envFrom: [{secretRef: {name: {{ .Values.existingSecret }}}}]
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 20, periodSeconds: 20}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          lifecycle:
            preStop: {exec: {command: ["sh", "-c", "sleep 10"]}}
          volumeMounts: [{name: temp, mountPath: /tmp}]
      volumes: [{name: temp, emptyDir: {}}]
