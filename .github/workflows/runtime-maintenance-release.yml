name: Publish signed runtime maintenance manifest

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag to create or update with the signed manifest
        required: true
        default: ${{ vars.PREDIXALEARN_MAINTENANCE_RELEASE_TAG }}
        type: string
      minimum_app_version:
        description: Minimum PredixaLearn version accepted by the runtime release
        required: true
        default: ${{ vars.PREDIXALEARN_MINIMUM_APP_VERSION }}
        type: string
      components_file:
        description: Reviewed component metadata file, relative to repository root
        required: true
        default: ${{ vars.PREDIXALEARN_COMPONENTS_FILE }}
        type: string
      manifest_expiry_days:
        description: Signed manifest lifetime in days (1-90)
        required: true
        default: ${{ vars.PREDIXALEARN_MANIFEST_EXPIRY_DAYS }}
        type: string

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Python dependencies
        working-directory: apps/ocr-studio
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Install browser assets
        run: |
          npm ci
          npm run assets:sync
          npm run vendor
          npm run assets:verify
          npm run typecheck
      - name: Validate OCR runtime and browser behavior
        working-directory: apps/ocr-studio
        run: |
          python -m ruff check app tests run.py
          python -m pytest -q
          python -m pip_audit -r requirements.txt
      - name: Run browser and accessibility smoke tests
        env:
          PREDIXALEARN_PYTHON: python
        run: |
          npx playwright install chromium
          npm run test:ocr
      - name: Build and sign immutable manifest
        shell: pwsh
        env:
          PREDIXALEARN_UPDATE_SIGNING_KEY: ${{ secrets.PREDIXALEARN_UPDATE_SIGNING_KEY }}
        run: |
          if (-not (Test-Path "${{ inputs.components_file }}")) { throw "Reviewed component metadata is missing." }
          python apps/ocr-studio/scripts/build_update_manifest.py `
            --release-tag "${{ inputs.release_tag }}" `
            --minimum-app-version "${{ inputs.minimum_app_version }}" `
            --components "${{ inputs.components_file }}" `
            --output "release-manifest/predixalearn-update-manifest.json" `
            --signature-output "release-manifest/predixalearn-update-manifest.json.sig" `
            --expires-days "${{ inputs.manifest_expiry_days }}" `
            --expected-public-key "apps/ocr-studio/app/maintenance/predixalearn-update-public.pem"
      - name: Create the selected public Release when it is missing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.release_tag }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --title "PredixaLearn $tag" `
              --notes "Signed maintenance-channel health bootstrap. This release intentionally contains no approved runtime updates."
          }
          $release = gh release view $tag --json isDraft,isPrerelease,tagName | ConvertFrom-Json
          if ($release.isDraft -or $release.isPrerelease -or $release.tagName -ne $tag) {
            throw "The selected maintenance Release must be published and non-prerelease."
          }
      - name: Publish signed manifest to the selected release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release_tag }}" release-manifest/predixalearn-update-manifest.json release-manifest/predixalearn-update-manifest.json.sig --clobber
      - name: Verify the published public maintenance channel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.release_tag }}"
          New-Item -ItemType Directory -Force -Path release-verification | Out-Null
          gh release download $tag `
            --pattern "predixalearn-update-manifest.json" `
            --pattern "predixalearn-update-manifest.json.sig" `
            --dir release-verification `
            --clobber
          python apps/ocr-studio/scripts/verify_update_manifest.py `
            --manifest "release-verification/predixalearn-update-manifest.json" `
            --signature "release-verification/predixalearn-update-manifest.json.sig" `
            --public-key "apps/ocr-studio/app/maintenance/predixalearn-update-public.pem"
          $release = gh release view $tag --json isDraft,isPrerelease | ConvertFrom-Json
          if ($release.isDraft -or $release.isPrerelease) {
            throw "Published maintenance verification requires a public, non-prerelease Release."
          }
